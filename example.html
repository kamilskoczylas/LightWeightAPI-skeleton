<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightWeightAPI Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        pre {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>LightWeightAPI Example</h1>
    <p>Loading data from <code>api.php?request=GetExampleDataRequest&example_id=1</code>.</p>
    <button id="loadButton">Load example data</button>
    <pre id="result">Waiting for response...</pre>

    <script>
        const result = document.getElementById('result');
        const loadButton = document.getElementById('loadButton');

        async function loadExample() {
            result.textContent = 'Loading...';

            try {
                const response = await fetch('api.php?request=GetExampleDataRequest&id=1');
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }

        loadButton.addEventListener('click', loadExample);
        loadExample();
    </script>
</body>

</html>
